name: LUNO CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: luno_user
          POSTGRES_PASSWORD: luno_password
          POSTGRES_DB: luno_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luno_user -d luno_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://luno_user:luno_password@localhost:5432/luno_db
      SECRET_KEY: ci-test-anahtari
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Bağımlılıkları yükle
        run: python -m pip install -r requirements.txt
      - name: Migration'ları PostgreSQL'de çalıştır
        run: alembic upgrade head
      - name: Backend testleri
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
