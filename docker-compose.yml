version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: luno_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-luno_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luno_password}
      POSTGRES_DB: ${POSTGRES_DB:-luno_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luno_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://luno_user:luno_password@db:5432/luno_db}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luno_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
